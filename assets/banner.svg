<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1e3a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- decorative code lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3b82f6" fill-opacity="0.28">
    <text x="60" y="70">const engineer = {</text>
    <text x="90" y="100">stack: ["TypeScript", "Next.js", "NestJS"],</text>
    <text x="90" y="130">ai: ["RAG", "agents", "fine-tuning"],</text>
    <text x="90" y="160">systems: ["C", "C++", "Docker"],</text>
    <text x="60" y="190">};</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#a78bfa" fill-opacity="0.25">
    <text x="820" y="290">async function ship() {</text>
    <text x="850" y="320">while (true) { build(); };</text>
    <text x="820" y="350">}</text>
  </g>

  <!-- glow accents -->
  <circle cx="1080" cy="70" r="120" fill="#3b82f6" fill-opacity="0.10"/>
  <circle cx="120" cy="340" r="100" fill="#a78bfa" fill-opacity="0.10"/>

  <!-- main title -->
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Marin Benchellal</text>

  <!-- gradient divider -->
  <rect x="480" y="235" width="240" height="4" rx="2" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#9daec9">Full-Stack TypeScript · GenAI &amp; LLM Systems</text>
</svg>
